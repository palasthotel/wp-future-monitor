name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      slug: future-monitor
      dev-plugin-name: Future Monitor - DEV
      # Requires PHP: 8.0 - the code uses typed and nullable properties
      php-versions: '["8.0", "8.2", "8.3", "8.4"]'
      required-files: |
        vendor/autoload.php
        languages/future-monitor.pot
        languages/future-monitor-de_DE.mo
        languages/future-monitor-de_CH.mo
        languages/future-monitor-de_CH_informal.mo
